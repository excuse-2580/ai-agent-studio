name: Build Android APK (llama.cpp + JNI)

# 让 GitHub 的云机器帮你编译 APK：
#   它自带 JDK / Android SDK / NDK，会把 llama.cpp 交叉编译进 APK，
#   产物 app-debug.apk 自动发到 Releases，手机下载安装即可离线跑模型。
#
# 触发：
#   1. push 到 main 且 android-native/** 有改动
#   2. 手动：Actions → Build Android APK → Run workflow

on:
  push:
    branches: [main]
    paths:
      - 'android-native/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

# 防止连续 push 触发多个 run 抢同一个 Release（之前就是这样失败的）
concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 自带 Android SDK（ANDROID_HOME）+ NDK + cmake，直接用就行。
      # 之前用第三方 setup-android action，在云机器上会自己跑挂，去掉了。
      - name: 检查 Android 环境
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls "$ANDROID_HOME" 2>/dev/null || echo "（没有 ANDROID_HOME）"
          ls "$ANDROID_HOME/ndk" 2>/dev/null || echo "（没有 ndk 目录）"
          ls "$ANDROID_HOME/platforms" 2>/dev/null | head
          ls "$ANDROID_HOME/build-tools" 2>/dev/null | head
          cmake --version | head -1
          # 新版 AndroidX 依赖普遍要求 compileSdk 35，缺就装
          if [ -d "$ANDROID_HOME/platforms/android-35" ]; then
            echo "已有 android-35"
          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              --licenses >/dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              --install "platforms;android-35" "build-tools;35.0.0" 2>&1 | tail -5
          else
            echo "（没有 sdkmanager，用自带的 platform）"
          fi

      - name: Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # llama.cpp 源码不进仓库（太大），编译时现拉
      # 锁死 commit：上游 API 改得很勤，不锁的话哪天就编不过了
      - name: 拉取 llama.cpp
        working-directory: android-native
        env:
          LLAMA_CPP_REF: 2b129ccfa03aea330d2d9ac4650a10de393dbe3a
        run: bash scripts/fetch-llama-cpp.sh

      - name: 授权 gradlew
        working-directory: android-native
        run: chmod +x gradlew

      # 只编 arm64-v8a：现代安卓手机都是 64 位，省一半编译时间和体积
      # 日志存一份，失败时能翻
      - name: 编译 Debug APK
        id: gradle
        working-directory: android-native
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          test ${PIPESTATUS[0]} -eq 0

      - name: 上传编译日志（失败时排查用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android-native/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-studio-android-apk
          path: android-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # 用成熟的发布 action，比手写 gh 命令稳
      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-native-latest
          name: "AI Agent Studio · 原生安卓 APK（含 llama.cpp）"
          files: android-native/app/build/outputs/apk/debug/*.apk
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 把日志写回仓库
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd android-native
          {
            echo "commit: ${GITHUB_SHA}"
            echo "date:   $(date -u)"
            echo "=== What went wrong ==="
            awk '/What went wrong:/{f=1} f{print; n++} n>40{exit}' build.log
            echo
            echo "=== Caused by ==="
            grep -m8 -A4 "Caused by" build.log
            echo
            echo "=== 错误片段 ==="
            grep -nE "error:|CMake Error|FAILED|Could not|requires|^e: " build.log | head -40
            echo
            echo "=== Kotlin 错误 ==="
            grep -E "^e: " build.log | head -60
            echo
            echo "=== CMake 详细 ==="
            grep -m10 -B2 -A6 "CMake Error" build.log
            echo
            echo "=== 日志尾部 ==="
            tail -120 build.log
          } > "../ci-fail-${GITHUB_RUN_NUMBER}.txt" 2>&1 || true
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "ci-fail-${GITHUB_RUN_NUMBER}.txt"
          git commit -m "ci: 保存失败日志（自动）" || exit 0
          git push

