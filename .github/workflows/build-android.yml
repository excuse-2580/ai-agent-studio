name: Build Android APK (llama.cpp + JNI)

# 让 GitHub 的云机器帮你编译 APK：
#   它自带 JDK / Android SDK / NDK，会把 llama.cpp 交叉编译进 APK，
#   产物 app-debug.apk 自动发到 Releases，手机下载安装即可离线跑模型。
#
# 触发：
#   1. push 到 main 且 android-native/** 有改动
#   2. 手动：Actions → Build Android APK → Run workflow

on:
  push:
    branches: [main]
    paths:
      - 'android-native/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 自带 Android SDK（ANDROID_HOME）+ NDK + cmake，直接用就行。
      # 之前用第三方 setup-android action，在云机器上会自己跑挂，去掉了。
      - name: 检查 Android 环境
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls "$ANDROID_HOME" 2>/dev/null || echo "（没有 ANDROID_HOME）"
          ls "$ANDROID_HOME/ndk" 2>/dev/null || echo "（没有 ndk 目录）"
          ls "$ANDROID_HOME/platforms" 2>/dev/null | head
          ls "$ANDROID_HOME/build-tools" 2>/dev/null | head
          cmake --version | head -1

      - name: Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # llama.cpp 源码不进仓库（太大），编译时现拉
      # 锁死 commit：上游 API 改得很勤，不锁的话哪天就编不过了
      - name: 拉取 llama.cpp
        working-directory: android-native
        env:
          LLAMA_CPP_REF: 2b129ccfa03aea330d2d9ac4650a10de393dbe3a
        run: bash scripts/fetch-llama-cpp.sh

      - name: 授权 gradlew
        working-directory: android-native
        run: chmod +x gradlew

      # 只编 arm64-v8a：现代安卓手机都是 64 位，省一半编译时间和体积
      # 日志存一份，失败时能翻
      - name: 编译 Debug APK
        id: gradle
        working-directory: android-native
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          test ${PIPESTATUS[0]} -eq 0

      - name: 上传编译日志（失败时排查用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android-native/build.log
          if-no-files-found: ignore
          retention-days: 7

      # 失败时把日志尾部写回仓库，方便直接查看（这个文件不触发构建）
      - name: 把失败日志写回仓库
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd android-native
          {
            echo "commit: ${GITHUB_SHA}"
            echo "date:   $(date -u)"
            echo "=== 错误片段 ==="
            grep -nE "error:|error\.|FAILED|CMake Error|fatal:|Could not|failed" build.log | head -60
            echo
            echo "=== 日志尾部 ==="
            tail -120 build.log
          } > ../ci-fail-log.txt 2>&1 || true
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-fail-log.txt
          git commit -m "ci: 保存失败日志（自动）" || exit 0
          git push

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-studio-android-apk
          path: android-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 发布到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK=$(ls android-native/app/build/outputs/apk/debug/*.apk | head -1)
          echo "产物：$APK（$(du -h "$APK" | cut -f1））"

          NOTES='GitHub Actions 自动编译，提交 ${{ github.sha }}

          ## 装到手机
          下载下面的 app-debug.apk，传到手机安装（提示"未知来源"时允许一次就行）。

          ## 怎么用离线模型
          1. 先下载一个 GGUF 模型放到手机上，推荐 Qwen2.5-1.5B-Instruct-Q4_K_M（约 1GB）
             （HuggingFace 打不开就把网址里的 huggingface.co 换成 hf-mirror.com）
          2. 打开 App →「模型」→ 选 .gguf → 点「加载」
          3. 等状态变成"已就绪"，回「对话」页就能离线聊了

          ## 云端模型
          在「模型」页点 DeepSeek / Kimi / 智谱 / 硅基流动 / OpenAI / 混元 一键填写，
          Ollama 和 llama.cpp server 填电脑的局域网地址也能用。'

          # 覆盖式更新同一个预发布版本，避免堆积
          gh release delete android-ci --yes --cleanup-tag 2>/dev/null || true
          git push origin :refs/tags/android-ci 2>/dev/null || true

          gh release create android-ci \
            --prerelease \
            --title "AI Agent Studio · 安卓 APK（自动构建）" \
            --notes "$NOTES" \
            "$APK"
